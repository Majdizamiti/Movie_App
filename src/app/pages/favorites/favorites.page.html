<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>My Favorites ❤️</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="none" *ngIf="favorites.length > 0">
    <ion-item *ngFor="let fav of favorites">
      <ion-thumbnail slot="start" style="cursor: pointer;" (click)="viewDetails(fav.movieId)">
        <img [src]="fav.posterPath || 'https://ionicframework.com/docs/img/demos/thumbnail.svg'" />
      </ion-thumbnail>
      <ion-label style="cursor: pointer;" (click)="viewDetails(fav.movieId)">
        <h2 style="font-weight: 700;">{{ fav.title }}</h2>
        <p style="color: var(--ion-color-medium);">Added: {{ fav.addedAt | date:'mediumDate' }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" fill="clear" (click)="remove(fav.movieId)">
        <ion-icon name="trash" slot="icon-only" style="font-size: 20px;"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <div *ngIf="favorites.length === 0" style="text-align: center; margin-top: 100px;">
    <ion-icon name="heart-dislike-outline" style="font-size: 72px; color: var(--ion-color-medium); margin-bottom: 12px;"></ion-icon>
    <h3 style="color: var(--ion-color-medium);">No favorites added yet.</h3>
    <p style="color: var(--ion-color-step-400);">Explore movies and tap the heart icon!</p>
  </div>
</ion-content>
