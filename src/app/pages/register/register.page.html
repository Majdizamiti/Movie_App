<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button routerLink="/login">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Create Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-margin">
    <ion-card>
      <ion-card-header>
        <div class="ion-text-center">
          <ion-avatar style="margin: 0 auto 12px auto; width: 80px; height: 80px;">
            <img [src]="photoUrl || 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
          </ion-avatar>
          <ion-button fill="outline" size="small" (click)="takePhoto()">
            <ion-icon name="camera-outline" slot="start"></ion-icon> Take Photo
          </ion-button>
        </div>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="full">
          <ion-item>
            <ion-input label="First Name" labelPlacement="floating" [(ngModel)]="firstName" placeholder="John"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input label="Last Name" labelPlacement="floating" [(ngModel)]="lastName" placeholder="Doe"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input label="Age" labelPlacement="floating" type="number" [(ngModel)]="age" placeholder="25"></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              type="email"
              label="Email"
              labelPlacement="floating"
              placeholder="email@domain.com"
              helperText="Enter a valid email"
              errorText="Invalid email"
              [(ngModel)]="email"
              email
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              type="password"
              label="Password"
              labelPlacement="floating"
              [(ngModel)]="password"
            >
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </ion-item>
        </ion-list>

        <ion-text color="danger" *ngIf="errorMessage">
          <p class="ion-text-center ion-padding-vertical">{{ errorMessage }}</p>
        </ion-text>

        <ion-button expand="block" (click)="onRegister()" class="ion-margin-top">
          Register Account
        </ion-button>

        <div class="ion-text-center ion-margin-top">
          <p>Already have an account? <a routerLink="/login" style="font-weight: 600; text-decoration: none;">Sign In</a></p>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
