<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button routerLink="/login">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Create Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="register-wrapper">
    <div class="register-card">
      <div class="avatar-section">
        <ion-avatar>
          <img [src]="photoUrl || 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
        </ion-avatar>
        <ion-button fill="outline" size="small" shape="round" (click)="takePhoto()">
          <ion-icon name="camera-outline" slot="start"></ion-icon> Take Photo
        </ion-button>
      </div>

      <ion-list>
        <ion-item>
          <ion-input label="First Name" [(ngModel)]="firstName" placeholder="John"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Last Name" [(ngModel)]="lastName" placeholder="Doe"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Age" type="number" [(ngModel)]="age" placeholder="25"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            type="email"
            label="Email"
            placeholder="email@domain.com"
            helperText="Enter a valid email"
            errorText="Invalid email"
            [(ngModel)]="email"
            email
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            type="password"
            label="Password"
            [(ngModel)]="password"
          >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>
      </ion-list>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="ion-text-center">{{ errorMessage }}</p>
      </ion-text>

      <ion-button expand="block" (click)="onRegister()" shape="round" class="ion-margin-top">
        Register Account
      </ion-button>

      <div class="ion-text-center ion-margin-top">
        <p>Already have an account? <a routerLink="/login" style="font-weight: 600; text-decoration: none;">Sign In</a></p>
      </div>
    </div>
  </div>
</ion-content>
