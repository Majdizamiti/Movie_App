<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ movie?.title || 'Film Details' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="movie">
  <div class="backdrop-container">
    <img [src]="movie.backdropPath || movie.posterPath || 'https://ionicframework.com/docs/img/demos/card-media.png'" />
  </div>

  <div class="details-content">
    <h1 style="font-weight: 800; font-size: 26px; margin-bottom: 8px;">{{ movie.title }}</h1>

    <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 16px;">
      <ion-badge color="medium" style="font-size: 14px; padding: 6px 10px;">📅 {{ movie.releaseDate }}</ion-badge>
      <ion-badge color="warning" style="font-size: 14px; padding: 6px 10px;">⭐ {{ movie.voteAverage }} / 10</ion-badge>
    </div>

    <ion-button expand="block" [color]="isFav ? 'danger' : 'primary'" (click)="toggleFavorite()" shape="round" style="margin-bottom: 24px;">
      <ion-icon [name]="isFav ? 'heart' : 'heart-outline'" slot="start"></ion-icon>
      {{ isFav ? 'Remove from Favorites' : 'Add to Favorites ❤️' }}
    </ion-button>

    <h3 style="font-weight: 700; margin-bottom: 8px;">Overview</h3>
    <p style="line-height: 1.6; color: var(--ion-color-step-600, #666);">{{ movie.overview }}</p>
  </div>
</ion-content>
