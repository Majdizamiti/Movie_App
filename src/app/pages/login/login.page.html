<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">🎬 MovieApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <ion-icon name="film-outline"></ion-icon>
        <h2>Welcome Back</h2>
        <p>Sign in to explore & match movies</p>
      </div>

      <ion-input
        type="email"
        fill="solid"
        label="Email"
        labelPlacement="floating"
        helperText="Enter a valid email"
        errorText="Invalid email"
        [(ngModel)]="email"
        email
        class="ion-margin-bottom"
      ></ion-input>

      <ion-input
        type="password"
        fill="solid"
        label="Password"
        labelPlacement="floating"
        [(ngModel)]="password"
        class="ion-margin-bottom"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="ion-text-center ion-padding-vertical">{{ errorMessage }}</p>
      </ion-text>

      <ion-button expand="block" (click)="onLogin()" shape="round">
        Sign In
      </ion-button>

      <div class="ion-text-center ion-margin-top">
        <p>Don't have an account? <a routerLink="/register" style="font-weight: 600; text-decoration: none;">Register</a></p>
      </div>
    </div>
  </div>
</ion-content>
