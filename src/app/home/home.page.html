<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>🎬 MovieApp Discover</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToFavorites()">
        <ion-icon name="heart" slot="icon-only" color="light"></ion-icon>
      </ion-button>
      <ion-button (click)="goToMatching()">
        <ion-icon name="people" slot="icon-only" color="light"></ion-icon>
      </ion-button>
      <ion-button (click)="goToProfile()">
        <ion-icon name="person" slot="icon-only" color="light"></ion-icon>
      </ion-button>
      <ion-button *ngIf="isAdmin()" (click)="goToAdmin()">
        <ion-icon name="settings" slot="icon-only" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar [(ngModel)]="searchQuery" (ionInput)="onSearch()" placeholder="Search movies, genres..." animated="true"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-margin">
    <ion-grid>
      <ion-row>
        <ion-col size="6" size-md="4" size-lg="3" *ngFor="let movie of movies">
          <ion-card class="movie-card" (click)="viewDetails(movie.id)">
            <img [src]="movie.posterPath || 'https://ionicframework.com/docs/img/demos/card-media.png'" />
            <ion-card-header style="padding: 12px 12px 0 12px;">
              <ion-card-subtitle>{{ movie.releaseDate | date:'yyyy' }}</ion-card-subtitle>
              <ion-card-title class="movie-title">{{ movie.title }}</ion-card-title>
            </ion-card-header>
            <ion-card-content style="padding: 8px 12px 12px 12px; display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 13px; font-weight: 600;">⭐ {{ movie.voteAverage | number:'1.1-1' }}</span>
              <ion-button fill="clear" size="small" (click)="toggleFavorite(movie, $event)">
                <ion-icon [name]="isFavorite(movie.id) ? 'heart' : 'heart-outline'" [color]="isFavorite(movie.id) ? 'danger' : 'medium'" style="font-size: 20px;"></ion-icon>
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
